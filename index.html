<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .feed-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    .card {
      display: block;
      text-decoration: none;
      width: 100%;
    }

    .card-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0 !important;
    }
  </style>
</head>
<body>

  <div class="feed-container">
    <a href="https://seu-link-aqui.com" class="card" target="_blank">
      <img src="583152323_17905895124272252_1555963115671299156_n.jpg" alt="Imagem 1" class="card-image">
    </a>

    <a href="https://seu-link-aqui.com" class="card" target="_blank">
      <img src="foto2.jpg" alt="Imagem 2" class="card-image">
    </a>

    <a href="https://seu-link-aqui.com" class="card" target="_blank">
      <img src="foto3.jpg" alt="Imagem 3" class="card-image">
    </a>
  </div>

</body>
</html>
